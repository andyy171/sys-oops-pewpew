name: Markdown Secret Scan

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**/*.md"
      - ".github/scripts/scan_markdown_secrets.py"
      - ".github/workflows/check-md-secrets.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - ".github/scripts/scan_markdown_secrets.py"
      - ".github/workflows/check-md-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-markdown:
    name: Scan Markdown for likely secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        run: python .github/scripts/scan_markdown_secrets.py --base docs
