name: Docs CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-ci.yml"
      - ".github/scripts/check_markdown_internal_links.py"
  pull_request:
    paths:
      - "docs/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-ci.yml"
      - ".github/scripts/check_markdown_internal_links.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build documentation
        env:
          READTHEDOCS_CANONICAL_URL: https://andynael.github.io/
        run: mkdocs build --clean

  internal-links:
    name: Check internal Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check local links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python .github/scripts/check_markdown_internal_links.py --docs-root docs --changed-from "$BASE_SHA"
          else
            echo "No base SHA available; skipping changed-file link check."
          fi
