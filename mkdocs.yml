site_name: Andy Nael's Docs
site_url: https://system-notes.netlify.app 
site_author: Andy Nael 
site_description: Tài liệu System Administration và DevOps
repo_name: SRE
repo_url: https://github.com/AndyNael/SRE/ 

theme:
  name: material
  language: vi 
  icon:
    logo: material/library
    repo: fontawesome/brands/github
  favicon: images/favicon.png 

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: purple
      toggle:
        icon: material/weather-night
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang giao diện sáng

  features:
  - navigation.sections
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - toc.follow
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - search.highlight
  - search.suggest
  
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - mathjax.js
# --- PLUGINS ---
plugins:
  - search 
  - awesome-pages 
  - mkdocs-backlinks-plugin
  - mkdocs-roamlinks-plugin

markdown_extensions:

  - pymdownx.arithmatex

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - admonition
  - pymdownx.details

  - pymdownx.tasklist:
      custom_checkbox: true

  - attr_list

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg