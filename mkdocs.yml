# --- THÔNG TIN CƠ BẢN ---
# --- THÔNG TIN CƠ BẢN ---
site_name: Andy Nael's Docs
site_url: https://your-site-name.netlify.app 
site_author: Andy Nael 
site_description: Tài liệu System Administration và DevOps
repo_name: SRE
repo_url: https://github.com/AndyNael/SRE/ 
edit_uri: 'https://github.com/AndyNael/SRE/edit/main/docs/'
# --- GIAO DIỆN (THEME) ---
theme:
  name: material
  language: vi 
  # Logo và Favicon (Nếu chưa có thì dùng icon mặc định)
  icon:
    logo: material/library
    repo: fontawesome/brands/github
  favicon: images/favicon.png 

  # Cấu hình màu sắc và Dark Mode
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: purple
      toggle:
        icon: material/weather-night
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang giao diện sáng

  nav:
  - Trang chủ: index.md
  
  - 1. Kiến thức Cơ bản:
      - Nền tảng (Fundamentals): 00-fundamentals/
      - Hệ điều hành Linux: 01-linux/
      - Mạng máy tính (Network): 02-network/

  - 2. Kiến thức Cốt lõi:
      - Quản trị & Tự động hóa: 03-system-administration-and-automation/
      - Container & Ảo hóa: 04-containerization-and-virtualization/
      - Cloud & IaC: 05-cloud-and-iac/
      - Giám sát (Observability): 06-observability-and-monitoring/
      - Bảo mật (Security): 07-security-and-hardening/
      - Lưu trữ & Phân tán: 08-storage-and-distributed-systems/

  - 3. Kiến thức Nâng cao:
      - CI/CD & DevOps: 09-cicd-devops-integration/
      - Thiết kế hệ thống: 10-system-design-and-architecture/
  # Các tính năng UX/UI cao cấp
  features:
    - navigation.sections
    - navigation.tabs.sticky 
    - navigation.top 
    - navigation.tracking 
    - toc.follow 
    - content.code.copy 
  extra_css: 
    - assets/extra.css
  
# --- PLUGINS ---
plugins:
  - search 
  - awesome-pages 

# --- CẤU HÌNH MARKDOWN (QUAN TRỌNG CHO DOCS KỸ THUẬT) ---
markdown_extensions:
  # 1. Xử lý code block
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences 

  # 2. Tạo các Tab nội dung (Ví dụ: Tab 1 là lệnh Ubuntu, Tab 2 là lệnh CentOS)
  - pymdownx.tabbed:
      alternate_style: true

  # 3. Các khối ghi chú (Note, Warning, Tip, Danger...)
  - admonition
  - pymdownx.details 
  - pymdownx.tasklist:
      custom_checkbox: true

  # 4. Tiện ích khác
  - attr_list 
  -  pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg